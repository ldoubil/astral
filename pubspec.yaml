name: astral
description: 'astral'
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.9.7


environment:
  sdk: ^3.7.0

dependencies:
  open_file: ^3.0.0
  vpn_service_plugin:
    path: vpn_service_plugin
  flutter:
    sdk: flutter
  path: ^1.8.3
  rust_lib_astral:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  signals_flutter: ^6.0.2
  isar_community_flutter_libs: # contains Isar Core
    version: 3.3.0
  window_manager: ^0.4.3
  flutter_colorpicker: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  uuid: ^3.0.7
  flutter_localizations:
    sdk: flutter
  vyuh_node_flow: ^0.22.2
  device_info_plus: ^11.4.0
  isar_community:
    version: 3.3.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  tray_manager: ^0.5.0
  app_links: ^6.4.0
  permission_handler: ^11.0.1
  easy_localization: ^3.0.7+1
  http: ^1.1.0
  flutter_local_notifications: ^19.3.1
  home_widget: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.4
  isar_community_generator:
    version: 3.3.0

flutter:
  uses-material-design: true
  assets:
    # - assets/dlls/
    - assets/icon.ico
    - assets/logo.png
    - assets/translations/

  fonts:
    - family: MiSans
      fonts:
        - asset: fonts/MiSans-Demibold.ttf
        - asset: fonts/MiSans-Regular.ttf
          weight: 800
