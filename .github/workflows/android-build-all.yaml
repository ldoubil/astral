name: 📱 构建 Android-build-all

on:
  workflow_dispatch:
  push:  # 每次 push 到仓库时触发
    tags:
      - 'v*'  # 指定触发分支

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 确保有写入权限
      packages: write
    
    env:
      FLUTTER_VERSION: beta
      FLUTTER_CHANNEL: beta
      RUST_VERSION: 1.89.0
      NDK_VERSION: 28.2.13676358
      JDK_VERSION: 17
      CMAKE_VERSION: 3.18.1
    
    steps:
      - name: 🛠️ 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 🦀 设置 Rust 工具链 1.89.0
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_rust.sh
          $GITHUB_WORKSPACE/scripts/install_rust.sh

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libc6-dev
          sudo apt-get install -y libc6-dev-armhf-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          sudo apt-get install -y clang llvm libclang-dev
          sudo apt-get install -y libc-dev
          sudo apt-get install -y libc6-dev-i386 gcc-multilib g++-multilib
          sudo apt-get install -y protobuf-compiler

      - name: 🎯 配置 Rust 目标架构
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '28.2.13676358'
          cmake-version: '3.18.1'
          
      - name: 🐦 安装 Flutter
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_flutter.sh
          $GITHUB_WORKSPACE/scripts/install_flutter.sh

      - name: 📚 安装 Flutter 依赖
        run: |
          flutter pub get

      - name: 🦀 安装 cargo-ndk
        run: |
          cargo install cargo-ndk

      - name: 🔧 设置 bindgen 环境变量
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include -I/usr/include/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: 🔐 设置签名配置
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          # 调试信息（不会显示敏感内容）
          echo "检查 key.properties 是否创建成功:"
          ls -la android/key.properties
          echo "检查 keystore 是否创建成功:"
          ls -la android/app/upload-keystore.jks

      - name: 🛠️ 构建 universal APK
        run: |
          # 清理之前的构建产物
          flutter clean
          cd rust && cargo clean && cd ..
          
          # 构建全架构 APK
          flutter build apk --release

      - name: 📤 上传全架构 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astral-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
