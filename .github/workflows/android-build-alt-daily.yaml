name: 📲 Android 备用包名每日构建

# 每天北京时间凌晨 1:00 触发（UTC 17:00）
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build-alt-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FLUTTER_VERSION: 3.46.0-1.0.pre-1
      FLUTTER_CHANNEL: main
      RUST_VERSION: 1.89.0
      NDK_VERSION: 28.2.13676358
      JDK_VERSION: 17
      CMAKE_VERSION: 3.18.1
      ALT_BUILD: true

    steps:
      - name: 🛠️ 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 🎲 生成随机包名与签名
        run: |
          BUILD_DATE=$(date -u +%Y%m%d)
          RAND=$(openssl rand -hex 4)
          rand_seg() {
            local letter
            letter=$(printf '%s\n' {a..z} | shuf -n 1)
            echo "${letter}$(openssl rand -hex 3)"
          }
          BRAND_SEG=$(rand_seg)
          APP_SEG=$(rand_seg)
          PACKAGE_ID="com.${BRAND_SEG}.${APP_SEG}.d${BUILD_DATE}.r${RAND}"
          KEYSTORE_PASS=$(openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 20)
          KEY_PASS="$KEYSTORE_PASS"

          echo "ANDROID_APPLICATION_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "BUILD_RAND=$RAND" >> "$GITHUB_ENV"
          echo "APK_BASENAME=astral-alt-${BUILD_DATE}-${RAND}-arm64" >> "$GITHUB_ENV"

          mkdir -p release

          keytool -genkeypair -v \
            -keystore android/app/alt-keystore.jks \
            -alias altkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Astral Alt, OU=CI, O=Astral, L=Unknown, ST=Unknown, C=CN"

          printf '%s\n' \
            "storePassword=$KEYSTORE_PASS" \
            "keyPassword=$KEY_PASS" \
            "keyAlias=altkey" \
            "storeFile=alt-keystore.jks" \
            > android/key.properties

          keytool -list -v -keystore android/app/alt-keystore.jks -storepass "$KEYSTORE_PASS" -alias altkey \
            | grep -E 'SHA1:|SHA256:' > "release/astral-alt-${BUILD_DATE}-${RAND}-arm64-cert.txt"

          cat > "release/astral-alt-${BUILD_DATE}-${RAND}-arm64-info.json" <<EOF
          {
            "package_id": "$PACKAGE_ID",
            "build_date_utc": "$BUILD_DATE",
            "artifact": "astral-alt-${BUILD_DATE}-${RAND}-arm64.apk",
            "note": "每日备用包名构建，用于规避部分机型因包名/签名冲突导致的安装失败"
          }
          EOF

          echo "本次包名: $PACKAGE_ID"

      - name: 🦀 设置 Rust 工具链
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_rust.sh
          $GITHUB_WORKSPACE/scripts/install_rust.sh

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libc6-dev
          sudo apt-get install -y libc6-dev-armhf-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          sudo apt-get install -y clang llvm libclang-dev
          sudo apt-get install -y libc-dev
          sudo apt-get install -y libc6-dev-i386 gcc-multilib g++-multilib
          sudo apt-get install -y protobuf-compiler

      - name: 🎯 配置 Rust 目标架构
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android

      - name: ☕ 设置 JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '28.2.13676358'
          cmake-version: '3.18.1'

      - name: 🐦 安装 Flutter
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_flutter.sh
          $GITHUB_WORKSPACE/scripts/install_flutter.sh

      - name: 📚 安装 Flutter 依赖
        run: |
          flutter pub get

      - name: 🦀 安装 cargo-ndk
        run: |
          cargo install cargo-ndk

      - name: 🔧 设置 bindgen 环境变量
        run: |
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include -I/usr/include/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: 🛠️ 构建备用包名 arm64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/${APK_BASENAME}.apk"
          ls -lh release/

      - name: 📤 上传备用 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}
          path: |
            release/${{ env.APK_BASENAME }}.apk
            release/${{ env.APK_BASENAME }}-info.json
            release/${{ env.APK_BASENAME }}-cert.txt
          retention-days: 30

      - name: 🚀 创建每日备用构建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-alt-${{ env.BUILD_DATE }}-${{ env.BUILD_RAND }}
          name: Android 备用包名 ${{ env.BUILD_DATE }} (${{ env.ANDROID_APPLICATION_ID }})
          body: |
            每日自动构建的备用 APK，包名与签名均为随机生成。

            - **包名**: `${{ env.ANDROID_APPLICATION_ID }}`
            - **架构**: arm64-v8a
            - **用途**: 若官方包名 `com.kevin.astral` 在部分机型上无法安装，可尝试此版本

            > 此构建不接入 Firebase，与正式版数据不互通；卸载旧版后安装即可。
          prerelease: true
          files: |
            release/${{ env.APK_BASENAME }}.apk
            release/${{ env.APK_BASENAME }}-info.json
            release/${{ env.APK_BASENAME }}-cert.txt
