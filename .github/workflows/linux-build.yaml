name: 🐧 构建 Linux 应用

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # 当推送版本标签时触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs-on: ubuntu-latest
            bundle-dir: build/linux/x64/release/bundle
            release-prefix: astral-linux-x64
            artifact-name: astral-linux-x64-all
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            bundle-dir: build/linux/arm64/release/bundle
            release-prefix: astral-linux-arm64
            artifact-name: astral-linux-arm64-all

    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
      packages: write

    env:
      FLUTTER_VERSION: beta
      FLUTTER_CHANNEL: beta
      RUST_VERSION: 1.89.0
      BUNDLE_DIR: ${{ matrix.bundle-dir }}
      RELEASE_PREFIX: ${{ matrix.release-prefix }}
      ARTIFACT_NAME: ${{ matrix.artifact-name }}

    steps:
      - name: 🛠️ 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 📌 读取应用版本号
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '\r')
            VERSION="${VERSION%%+*}"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      - name: 🦀 设置 Rust 工具链 ${{ env.RUST_VERSION }}
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_rust.sh
          $GITHUB_WORKSPACE/scripts/install_rust.sh

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgtk-3-dev
          sudo apt-get install -y clang cmake pkg-config libcurl4-openssl-dev
          sudo apt-get install -y protobuf-compiler
          sudo apt-get install -y libayatana-appindicator3-dev
          sudo apt-get install -y patchelf
          sudo apt-get install -y ruby-dev
          sudo gem install --no-document fpm
          sudo apt-get install -y fuse libfuse2

      - name: 🐦 安装 Flutter
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/install_flutter.sh
          $GITHUB_WORKSPACE/scripts/install_flutter.sh

      - name: 🎯 启用 Linux 桌面支持
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .

      - name: 📚 安装 Flutter 依赖
        run: |
          flutter pub get

      - name: 🛠️ 构建 Linux 应用 (${{ matrix.arch }})
        run: |
          flutter build linux --release
          ls -la "$BUNDLE_DIR"

      - name: 📦 打包应用
        run: |
          mkdir -p release
          cd "$BUNDLE_DIR"
          patchelf astral --add-needed libisar.so --add-needed librust_lib_astral.so
          tar -czf "$GITHUB_WORKSPACE/release/${RELEASE_PREFIX}.tar.gz" *
          echo "打包完成，检查文件大小："
          ls -lh "$GITHUB_WORKSPACE/release/"

      - name: 📦 打包 deb 包
        run: |
          mkdir -p release
          fpm -s dir -t deb -n astral -v "${APP_VERSION}" --prefix /opt/astral -C "$BUNDLE_DIR" .
          mv *.deb "$GITHUB_WORKSPACE/release/${RELEASE_PREFIX}.deb"

      - name: 📦 打包 rpm 包
        run: |
          mkdir -p release
          fpm -s dir -t rpm -n astral -v "${APP_VERSION}" --prefix /opt/astral -C "$BUNDLE_DIR" .
          mv *.rpm "$GITHUB_WORKSPACE/release/${RELEASE_PREFIX}.rpm"

      - name: 📤 上传 Linux 构建产物 (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/${{ matrix.release-prefix }}.tar.gz
            release/${{ matrix.release-prefix }}.deb
            release/${{ matrix.release-prefix }}.rpm
          retention-days: 7
